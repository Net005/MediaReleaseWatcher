name: Test and publish GHCR
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: media-release-watcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mrw_test
          POSTGRES_USER: mrw_test
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U mrw_test -d mrw_test'
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://mrw_test:synthetic-ci-password@localhost:5432/mrw_test?sslmode=disable
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm ci --no-audit --no-fund
      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: go build -trimpath ./cmd/media-release-watcher
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: media-release-watcher:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start real Compose stack
        run: |
          python3 scripts/configure.py
          docker compose -f compose.yaml -f .github/compose.ci.yaml up -d --wait --wait-timeout 120
      - name: Exercise web API and persistence
        run: python3 scripts/smoke.py --url http://127.0.0.1:8317
      - name: Exercise browser workflows
        env:
          MRW_BASE_URL: http://127.0.0.1:8317
        run: npm run test:e2e
      - name: Stop isolated stack
        if: always()
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml down -v

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/net005/mediareleasewatcher
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Media Release Watcher
            org.opencontainers.image.description=MDBList-first actress and media release tracking
            org.opencontainers.image.source=https://github.com/Net005/MediaReleaseWatcher
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
